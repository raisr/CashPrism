# Builds a release from a version tag on main. See docs/releasing.md.
#
# vX.Y.Z publishes a GitHub release and the container image as :X.Y.Z, and as
# :latest when tagged on main; it needs a `## [X.Y.Z]` section in CHANGELOG.md.
# vX.Y.Z-rc.N needs no section, creates a draft release, and pushes the image
# as :X.Y.Z-rc.N only.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Everything that can be wrong with the tag fails here, before anything is
  # built: a tag off main, a malformed version, a missing changelog section.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      on-main: ${{ steps.branch.outputs.on-main }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # main, or the release/X.Y branch a fix to an old release is made on.
      - name: Check that the tag is on main
        id: branch
        run: |
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "on-main=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          for branch in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "${GITHUB_SHA}" "${branch}"; then
              echo "${GITHUB_REF_NAME} is on ${branch#refs/remotes/origin/}."
              echo "on-main=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "::error::${GITHUB_REF_NAME} does not point at a commit on main or a release/X.Y branch."
          exit 1

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is not vX.Y.Z or vX.Y.Z-rc.N."
            exit 1
          fi
          prerelease=false
          if [[ "${version}" == *-rc.* ]]; then
            prerelease=true
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      # The section runs from its heading to the next version heading, or to
      # the compare links at the bottom of the file.
      - name: Write the release text
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ "${PRERELEASE}" = true ]; then
            heading="## [Unreleased]"
          else
            heading="## [${VERSION}]"
          fi
          awk -v heading="${heading}" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > section.md
          if [ "${PRERELEASE}" != true ] && ! grep -q '[^[:space:]]' section.md; then
            echo "::error::CHANGELOG.md has no '${heading}' section. Cut the changelog in a release pull request before tagging."
            exit 1
          fi
          {
            if [ "${PRERELEASE}" = true ]; then
              echo "Release candidate for ${VERSION%-rc.*}, built to check the release before anything is published."
              echo
            fi
            cat section.md
            echo
            sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes-footer.md
          } > release-notes.md
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

      # The platforms are the runtime identifiers CashPrism.Shell.csproj lists,
      # so a new one is released without touching this file. macOS builds run
      # on macOS, where the SDK signs the executable ad hoc; an unsigned one
      # does not start on Apple silicon at all.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: List the platforms
        id: platforms
        run: |
          identifiers="$(dotnet msbuild src/CashPrism.Shell/CashPrism.Shell.csproj -getProperty:RuntimeIdentifiers)"
          platforms="$(echo "${identifiers}" | tr ';' '\n' | jq -R -c -s '
            split("\n") | map(select(length > 0))
            | map({rid: ., runner: (if startswith("osx-") then "macos-latest" else "ubuntu-latest" end)})')"
          echo "platforms=${platforms}" >> "${GITHUB_OUTPUT}"
          echo "${platforms}"

  gates:
    needs: prepare
    uses: ./.github/workflows/gates.yml

  build:
    needs: [prepare, gates]
    name: build (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.platforms) }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: |
          name="cashprism-${VERSION}-${RID}"
          dotnet publish src/CashPrism.Shell -c Release -r "${RID}" -p:Version="${VERSION}" -o "out/${name}"

      # A tarball outside Windows keeps the executable bit, which a zip does not.
      - name: Pack
        run: |
          name="cashprism-${VERSION}-${RID}"
          cd out
          if [[ "${RID}" == win-* ]]; then
            zip -qr "../${name}.zip" "${name}"
          else
            tar -czf "../${name}.tar.gz" "${name}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.rid }}
          path: cashprism-*.*
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      ON_MAIN: ${{ needs.prepare.outputs.on-main }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Write the checksums
        run: |
          cp samples/demo-export.xlsx dist/
          cd dist
          sha256sum cashprism-* demo-export.xlsx > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        run: |
          flags=()
          if [ "${PRERELEASE}" = true ]; then
            flags+=(--draft --prerelease)
          fi
          if [ "${ON_MAIN}" != true ]; then
            flags+=(--latest=false)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "CashPrism ${VERSION}" \
            --notes-file release-notes.md \
            "${flags[@]}"

  # One runner builds both architectures: the build stage runs on the
  # runner's own, and the runtime stage executes nothing, so no emulation is
  # involved.
  image:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      ON_MAIN: ${{ needs.prepare.outputs.on-main }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The source annotation on the index is what links a multi-architecture
      # image to this repository on GHCR; the label alone sits on each image.
      # :latest moves only with a release from main — a fix to an old release
      # must not take it back to an older version.
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "${image}:${VERSION}")
          if [ "${PRERELEASE}" != true ] && [ "${ON_MAIN}" = true ]; then
            tags+=(--tag "${image}:latest")
          fi
          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${VERSION}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.description=CashPrism ${VERSION}" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            "${tags[@]}" \
            --push
