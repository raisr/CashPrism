# Dependabot proposes dependency updates as pull requests. How they are handled
# is recorded under "Deviations from the shared rules" in AGENTS.md.
version: 2

updates:
  - package-ecosystem: nuget
    # NuGet discovery starts from the solution, not from a recursive search.
    directory: "/src"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [chore]
    assignees: [raisr]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [chore]
    assignees: [raisr]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    labels: [chore]
    assignees: [raisr]
