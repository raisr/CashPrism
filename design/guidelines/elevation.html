<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--cp-bg);color:var(--cp-text)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:112px}.chip{height:56px;border-radius:10px;border:1px solid var(--cp-line)}.n{font-weight:700;font-size:12px;margin-top:6px}.v{font:500 11px/1.4 var(--cp-font-mono);color:var(--cp-text-2)}</style></head><body><div style="display:flex;gap:24px;padding:8px"><div class="cp-card" style="width:180px;height:90px;padding:14px"><span class="v">shadow-card</span></div><div style="width:180px;height:90px;padding:14px;border-radius:10px;background:var(--cp-surface);box-shadow:var(--cp-shadow-pop)"><span class="v">shadow-pop (tooltips, sheet)</span></div><div data-theme="dark" class="cp-card" style="width:180px;height:90px;padding:14px"><span class="v">dark: border only</span></div></div></body></html>
